<!-- ============================================
     TEMPLATE: EDITOR
     ============================================ -->

<div class="wiki-editor-page">
    <div class="editor-header">
        <h1>{{#if isEdit}}✏️ Editando: {{article.title}}{{else}}📝 Criar novo artigo{{/if}}</h1>
    </div>
    
    <!-- Formulário -->
    <form id="article-form" class="editor-form">
        <div class="form-group">
            <label for="article-title">Título *</label>
            <input type="text" id="article-title" value="{{article.title}}" required 
                   placeholder="Digite o título do artigo">
        </div>
        
        <div class="form-group">
            <label for="article-summary">Resumo</label>
            <textarea id="article-summary" rows="3" placeholder="Breve descrição do artigo">{{article.summary}}</textarea>
        </div>
        
        <!-- Editor de conteúdo -->
        <div class="form-group">
            <label>Conteúdo *</label>
            <div id="editor-container"></div>
        </div>
        
        <div class="form-group">
            <label>Categorias</label>
            <div class="category-selector">
                <input type="text" id="category-input" placeholder="Digite uma categoria" 
                       list="category-suggestions">
                <datalist id="category-suggestions"></datalist>
                <div id="category-tags" class="category-tags">
                    {{#each article.categories}}
                    <span class="category-tag">{{this}} <button type="button" onclick="window.editor.removeCategory('{{this}}')">×</button></span>
                    {{/each}}
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label>Tags</label>
            <div class="tag-selector">
                <input type="text" id="tag-input" placeholder="Digite uma tag" 
                       onkeydown="if(event.key==='Enter'){event.preventDefault();window.editor.addTag(this.value);this.value='';}">
                <div id="tag-tags" class="tag-tags">
                    {{#each article.tags}}
                    <span class="tag-tag">{{this}} <button type="button" onclick="window.editor.removeTag('{{this}}')">×</button></span>
                    {{/each}}
                </div>
            </div>
        </div>
        
        <div class="form-group">
            <label for="edit-summary">Resumo da edição</label>
            <input type="text" id="edit-summary" placeholder="O que você modificou?">
        </div>
        
        <!-- Ações -->
        <div class="editor-actions">
            <button type="button" onclick="window.history.back()" class="btn-secondary">Cancelar</button>
            <button type="submit" class="btn-primary">💾 Salvar artigo</button>
        </div>
    </form>
</div>
