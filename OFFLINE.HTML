<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - WikiZero</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Lato', sans-serif;
            background: #f6f6f6;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .offline-container {
            max-width: 500px;
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        
        .offline-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }
        
        h1 {
            color: #202122;
            margin-bottom: 10px;
        }
        
        p {
            color: #54595d;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #0645ad;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            transition: background 0.3s;
            border: none;
            cursor: pointer;
        }
        
        .btn:hover {
            background: #0b6bcd;
        }
        
        .recent-articles {
            margin-top: 20px;
            text-align: left;
        }
        
        .recent-articles h3 {
            font-size: 0.9rem;
            color: #54595d;
            margin-bottom: 10px;
        }
        
        .recent-articles ul {
            list-style: none;
        }
        
        .recent-articles li {
            padding: 8px 0;
            border-bottom: 1px solid #eaecf0;
        }
        
        .recent-articles li a {
            color: #0645ad;
            text-decoration: none;
        }
        
        .recent-articles li a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="offline-container">
        <div class="offline-icon">🌐</div>
        <h1>Você está offline</h1>
        <p>
            Parece que você perdeu a conexão com a internet.
            Não se preocupe, você pode acessar os artigos que já visitou.
        </p>
        
        <button class="btn" onclick="location.reload()">🔄 Tentar novamente</button>
        
        <div class="recent-articles">
            <h3>📚 Artigos disponíveis offline</h3>
            <ul id="offlineArticles">
                <li>Carregando...</li>
            </ul>
        </div>
    </div>
    
    <script>
        // Carregar artigos do cache
        async function loadOfflineArticles() {
            try {
                const cache = await caches.open('wikizero-v2');
                const keys = await cache.keys();
                const articles = [];
                
                for (const request of keys) {
                    if (request.url.includes('/article/')) {
                        const response = await cache.match(request);
                        if (response) {
                            const text = await response.text();
                            const title = text.match(/<title>(.*?)<\/title>/);
                            if (title) {
                                articles.push({
                                    url: request.url,
                                    title: title[1].replace(' - WikiZero', '')
                                });
                            }
                        }
                    }
                }
                
                const list = document.getElementById('offlineArticles');
                if (articles.length === 0) {
                    list.innerHTML = '<li>Nenhum artigo disponível offline</li>';
                } else {
                    list.innerHTML = articles.map(a => 
                        `<li><a href="${a.url}">${a.title}</a></li>`
                    ).join('');
                }
            } catch (error) {
                console.error('Erro ao carregar artigos offline:', error);
            }
        }
        
        loadOfflineArticles();
    </script>
</body>
</html>
